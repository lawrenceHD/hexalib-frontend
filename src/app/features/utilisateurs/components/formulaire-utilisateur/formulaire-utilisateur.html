<!-- src/app/features/utilisateurs/components/formulaire-utilisateur/formulaire-utilisateur.html -->

<div class="bg-white rounded-2xl shadow-xl w-full max-w-lg" (click)="$event.stopPropagation()" style="margin:5px;padding:5px">

  <!-- Header -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100" style="margin:5px;padding:5px">
    <h2 class="text-lg font-semibold text-gray-900">
      {{ isEdit ? 'Modifier l\'utilisateur' : 'Nouvel utilisateur' }}
    </h2>
    <button (click)="cancelled.emit()"
            class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Formulaire -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="px-6 py-5 space-y-4" style="margin:5px;padding:5px">

    <!-- Nom complet -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Nom complet *</label>
      <input formControlName="nomComplet" type="text" placeholder="Jean Dupont" style="margin:5px;padding:5px"
             class="w-full px-3 py-2.5 text-sm border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
             [class.border-red-300]="f('nomComplet')?.invalid && f('nomComplet')?.touched"
             [class.border-gray-200]="!(f('nomComplet')?.invalid && f('nomComplet')?.touched)"/>
      <p *ngIf="f('nomComplet')?.invalid && f('nomComplet')?.touched"
         class="mt-1 text-xs text-red-500">Nom complet obligatoire (min. 3 caractères)</p>
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Email *</label>
      <input formControlName="email" type="email" placeholder="jean@exemple.com"
      style="margin:5px;padding:5px"
             class="w-full px-3 py-2.5 text-sm border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
             [class.border-red-300]="f('email')?.invalid && f('email')?.touched"
             [class.border-gray-200]="!(f('email')?.invalid && f('email')?.touched)"/>
      <p *ngIf="f('email')?.invalid && f('email')?.touched"
         class="mt-1 text-xs text-red-500">Email valide obligatoire</p>
    </div>

    <!-- Rôle -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Rôle *</label>
      <select formControlName="role" style="margin:5px;padding:5px"
              class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        <option value="VENDEUR">Vendeur</option>
        <option value="ADMIN">Administrateur</option>
      </select>
    </div>

    <!-- Statut (édition uniquement) -->
    <div *ngIf="isEdit">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Statut</label>
      <select formControlName="statut" style="margin:5px;padding:5px"
              class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        <option value="ACTIF">Actif</option>
        <option value="INACTIF">Inactif</option>
      </select>
    </div>

    <!-- Mot de passe (création uniquement) -->
    <div *ngIf="!isEdit">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">
        Mot de passe
        <span class="text-gray-400 font-normal">(optionnel — auto-généré si vide)</span>
      </label>
      <div class="relative">
        <input formControlName="password" style="margin:5px;padding:5px"
               [type]="showPwd ? 'text' : 'password'"
               placeholder="Laisser vide pour générer automatiquement"
               class="w-full px-3 py-2.5 pr-10 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"/>
        <button type="button" (click)="togglePwd()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!showPwd" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            <path *ngIf="showPwd" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        </button>
      </div>
      <p class="mt-1 text-xs text-gray-400">
        Si un mot de passe temporaire est généré, il vous sera affiché après création.
      </p>
    </div>

    <!-- Actions -->
    <div class="flex gap-3 pt-2" style="margin:5px;padding:5px">
      <button type="button" (click)="cancelled.emit()"
              class="flex-1 px-4 py-2.5 border border-gray-200 text-sm font-medium text-gray-700 rounded-xl hover:bg-gray-50 transition-colors">
        Annuler
      </button>
      <button type="submit" [disabled]="loading"
              class="flex-1 px-4 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-700 transition-colors disabled:opacity-60 flex items-center justify-center gap-2">
        <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        {{ loading ? 'Enregistrement…' : (isEdit ? 'Mettre à jour' : 'Créer') }}
      </button>
    </div>
  </form>
</div>
