<div class="p-4 sm:p-6 lg:p-8 min-h-screen bg-gray-50 antialiased">
  <div class="mb-8 flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Catégories de Dépenses</h1>
      <p class="mt-1 text-sm text-gray-500">{{ categories.length }} catégorie(s)</p>
    </div>
    <button (click)="openCreate()" style="padding: 0.75rem 1rem;"
      class="inline-flex items-center bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-all shadow-md">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Nouvelle Catégorie
    </button>
  </div>

  <div *ngIf="loading" class="flex justify-center py-32">
    <div class="animate-spin rounded-full h-16 w-16 border-4 border-gray-200 border-t-indigo-600"></div>
  </div>

  <div *ngIf="!loading" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="w-full">
      <thead class="border-b border-gray-100 bg-gray-50">
        <tr>
          <th class="px-6 py-4 text-left text-xs font-bold uppercase text-gray-600">Nom</th>
          <th class="px-6 py-4 text-left text-xs font-bold uppercase text-gray-600">Description</th>
          <th class="px-6 py-4 text-left text-xs font-bold uppercase text-gray-600">Statut</th>
          <th class="px-6 py-4 text-right text-xs font-bold uppercase text-gray-600">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let cat of categories" class="hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 text-sm font-semibold text-gray-900">{{ cat.nom }}</td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ cat.description || '—' }}</td>
          <td class="px-6 py-4">
            <span class="inline-flex px-2.5 py-1 text-xs font-bold rounded-full"
              [class.bg-green-100]="cat.statut === 'ACTIF'"
              [class.text-green-700]="cat.statut === 'ACTIF'"
              [class.bg-red-100]="cat.statut === 'INACTIF'"
              [class.text-red-700]="cat.statut === 'INACTIF'">
              {{ cat.statut }}
            </span>
          </td>
          <td class="px-6 py-4 text-right">
            <div class="flex justify-end gap-2">
              <button (click)="openEdit(cat)" class="p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
                </svg>
              </button>
              <button (click)="toggle(cat)" class="p-2 rounded-lg transition-colors"
                [class.text-orange-600]="cat.statut === 'ACTIF'"
                [class.text-green-600]="cat.statut === 'INACTIF'">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/>
                </svg>
              </button>
              <button (click)="delete(cat)" class="p-2 text-red-600 hover:bg-red-50 rounded-lg">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="categories.length === 0">
          <td colspan="4" class="px-6 py-12 text-center text-gray-400">Aucune catégorie</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
    <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between">
      <h3 class="text-xl font-bold text-gray-900">
        {{ modalMode === 'create' ? 'Nouvelle Catégorie' : 'Modifier' }}
      </h3>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="formData.nom" name="nom" required style="padding: 0.75rem 1rem;"
          class="w-full border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-gray-50"
          placeholder="Ex: Loyer, Salaires, Électricité..."/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description <span class="text-gray-400 text-xs">(optionnel)</span></label>
        <textarea [(ngModel)]="formData.description" name="description" rows="3" style="padding: 0.75rem 1rem;"
          class="w-full border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-gray-50 resize-none"
          placeholder="Description de la catégorie..."></textarea>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="closeModal()" style="padding: 0.75rem 1rem;"
          class="px-5 py-2.5 text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 text-sm font-medium">
          Annuler
        </button>
        <button type="submit" [disabled]="modalLoading" style="padding: 0.75rem 1rem;"
          class="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 disabled:opacity-50 text-sm">
          {{ modalLoading ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
