<div class="p-4 sm:p-6 lg:p-8 min-h-screen bg-gray-50">

  <!-- En-tête -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Rapports & Statistiques</h1>
    <p class="mt-2 text-sm text-gray-600">Générez et téléchargez vos rapports d'activité</p>
  </div>

  <!-- Sélecteur de type -->
  <div class="bg-white rounded-lg shadow-sm p-4 mb-4 border border-gray-100">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Type de rapport</p>
    <div class="flex flex-wrap gap-2">
      <button
        *ngFor="let type of types"
        (click)="selectType(type.value)"
        [class]="typePeriode === type.value
          ? 'type-btn type-btn--active'
          : 'type-btn'"
      >
        <span class="type-btn__icon">{{ type.icon }}</span>
        {{ type.label }}
      </button>
    </div>
  </div>

  <!-- Filtres de période -->
  <div class="bg-white rounded-lg shadow-sm p-4 mb-6 border border-gray-100">
    <div class="flex flex-wrap items-end gap-4">

      <!-- Journalier -->
      <div *ngIf="typePeriode === 'journalier'" class="form-group">
        <label class="form-label">Date</label>
        <input type="date" [(ngModel)]="selectedDate" [max]="today" class="form-input"/>
      </div>

      <!-- Hebdomadaire -->
      <div *ngIf="typePeriode === 'hebdomadaire'" class="form-group">
        <label class="form-label">Date de fin de semaine</label>
        <input type="date" [(ngModel)]="selectedDateFin" [max]="today" class="form-input"/>
      </div>

      <!-- Mensuel -->
      <div *ngIf="typePeriode === 'mensuel'" class="form-group">
        <label class="form-label">Mois</label>
        <input type="month" [(ngModel)]="selectedMois" [max]="currentMois" class="form-input"/>
      </div>

      <!-- Annuel -->
      <div *ngIf="typePeriode === 'annuel'" class="form-group">
        <label class="form-label">Année</label>
        <select [(ngModel)]="selectedAnnee" class="form-input">
          <option *ngFor="let y of years" [value]="y">{{ y }}</option>
        </select>
      </div>

      <!-- Personnalisé -->
      <ng-container *ngIf="typePeriode === 'personnalise'">
        <div class="form-group">
          <label class="form-label">Date de début</label>
          <input type="date" [(ngModel)]="selectedDateDebut" [max]="today" class="form-input"/>
        </div>
        <div class="form-group">
          <label class="form-label">Date de fin</label>
          <input type="date" [(ngModel)]="selectedDateFinPerso" [max]="today" class="form-input"/>
        </div>
      </ng-container>

      <!-- Actions -->
      <div class="flex gap-3">
        <button
          (click)="generer()"
          [disabled]="loading"
          class="inline-flex items-center px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium rounded-lg hover:from-indigo-700 hover:to-purple-700 transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <svg *ngIf="loading" class="animate-spin w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <svg *ngIf="!loading" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          {{ loading ? 'Génération...' : 'Générer' }}
        </button>

        <button
          *ngIf="hasResult"
          (click)="telechargerPDF()"
          [disabled]="downloading"
          class="inline-flex items-center px-5 py-2.5 bg-white border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <svg class="w-4 h-4 mr-2 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          {{ downloading ? 'Téléchargement...' : 'Télécharger PDF' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Spinner -->
  <div *ngIf="loading" class="flex flex-col items-center justify-center py-24 gap-4">
    <div class="animate-spin rounded-full h-14 w-14 border-4 border-gray-200 border-t-indigo-600"></div>
    <p class="text-gray-500 text-sm">Génération du rapport en cours...</p>
  </div>

  <!-- Erreur -->
  <div *ngIf="error && !loading"
       class="flex items-center gap-3 p-4 mb-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    {{ error }}
  </div>

  <!-- Résultat -->
  <div *ngIf="!loading" class="bg-white rounded-lg shadow-sm border border-gray-100">

    <!-- Rapport journalier -->
    <app-rapport-journalier
      *ngIf="rapportJournalier"
      [rapport]="rapportJournalier">
    </app-rapport-journalier>

    <!-- Rapport périodique -->
    <app-rapport-periodique
      *ngIf="rapportPeriodique"
      [rapport]="rapportPeriodique">
    </app-rapport-periodique>

    <!-- État vide -->
    <div *ngIf="!hasResult && !error"
         class="flex flex-col items-center justify-center py-24 text-gray-400">
      <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <p class="text-lg font-medium">Aucun rapport généré</p>
      <p class="text-sm mt-1">Sélectionnez une période et cliquez sur Générer</p>
    </div>
  </div>

</div>
