<!-- Bouton Hamburger Mobile -->
<button
  (click)="toggleMobileMenu()"
  class="lg:hidden fixed top-4 left-4 z-50 p-3 bg-white rounded-md shadow-md hover:shadow-lg transition-shadow"
  aria-label="Ouvrir le menu"
>
  <app-icon [name]="isMobileMenuOpen ? 'x' : 'menu'" [size]="22" klass="text-slate-700"></app-icon>
</button>

<!-- Overlay mobile (cliquable pour fermer) -->
<div
  *ngIf="isMobileMenuOpen"
  (click)="toggleMobileMenu()"
  class="lg:hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-40 transition-opacity duration-300"
></div>

<!-- Sidebar -->
<aside
  [ngClass]="{
    'w-64': !(collapsed$ | async),
    'w-20':  (collapsed$ | async),
    'translate-x-0': isMobileMenuOpen,
    '-translate-x-full lg:translate-x-0': !isMobileMenuOpen,
    'transform': true
  }"
  class="fixed lg:static inset-y-0 left-0 z-40 bg-white h-screen border-r border-gray-200 transition-all duration-300 ease-in-out flex flex-col antialiased"
>
  <!-- Header Logo -->
  <div class="flex items-center justify-center h-16 border-b border-gray-200 px-4">
    <span
      *ngIf="!(collapsed$ | async)"
      class="text-xl font-bold text-gray-900"
    >
      Hexalib
    </span>
  </div>

  <!-- Profil utilisateur -->
  <div class="p-4 border-b border-gray-200">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-semibold text-lg shrink-0">
        {{ (currentUser?.nomComplet || 'U').charAt(0).toUpperCase() }}
      </div>
      <div *ngIf="!(collapsed$ | async)" class="min-w-0">
        <p class="text-sm font-medium text-gray-900 truncate">
          {{ currentUser?.nomComplet || 'Utilisateur' }}
        </p>
        <p class="text-xs text-gray-600">
          {{ currentUser?.role === 'ADMIN' ? 'Administrateur' : 'Vendeur' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Contenu menu -->
  <div class="flex-1 overflow-y-auto py-4">
    <ul class="flex flex-col space-y-1 px-3">
      <li *ngFor="let item of menuItems">
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-gray-100 text-indigo-700 border-l-4 border-indigo-600"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="handleMenuClick(item)"
          [class.opacity-50]="item.disabled"
          [class.pointer-events-none]="item.disabled"
          class="flex items-center h-11 px-4 rounded-lg hover:bg-gray-100 text-gray-700 hover:text-indigo-700 border-l-4 border-transparent transition-colors"
        >
          <app-icon [name]="item.icon" [size]="18" klass="shrink-0"></app-icon>
          <span
            *ngIf="!(collapsed$ | async)"
            class="ml-3 text-sm font-medium truncate"
          >
            {{ item.label }}
          </span>
          <span
            *ngIf="item.badge && !(collapsed$ | async)"
            class="ml-auto px-2 py-0.5 text-xs font-medium bg-indigo-100 text-indigo-700 rounded-full"
          >
            {{ item.badge }}
          </span>
        </a>
      </li>
    </ul>

    <!-- Déconnexion -->
    <div class="mt-auto border-t border-gray-200 pt-4 px-3 pb-6">
      <button
        (click)="logout()"
        class="flex items-center w-full h-11 px-4 rounded-lg hover:bg-gray-100 text-gray-700 hover:text-red-700 transition-colors"
      >
        <app-icon name="log-out" [size]="18" klass="shrink-0"></app-icon>
        <span *ngIf="!(collapsed$ | async)" class="ml-3 text-sm font-medium">
          Déconnexion
        </span>
      </button>
    </div>
  </div>
</aside>
