<!-- Bouton Mobile Hamburger -->
<button
  (click)="toggleMobileMenu()"
  class="lg:hidden fixed top-4 left-4 z-50 p-3 bg-white rounded-md shadow-md hover:shadow-lg transition-shadow"
  aria-label="Ouvrir le menu"
>
  <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
    <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M6 18L18 6M6 6l12 12" />
  </svg>
</button>

<!-- Overlay Mobile -->
<div
  *ngIf="isMobileMenuOpen"
  (click)="toggleMobileMenu()"
  class="lg:hidden fixed inset-0 bg-black/50 z-40 transition-opacity"
></div>

<!-- Sidebar -->
<aside
  [class.w-64]="!(collapsed$ | async)"
  [class.w-20]="(collapsed$ | async)"
  [class.translate-x-0]="isMobileMenuOpen"
  class="fixed lg:static inset-y-0 left-0 z-40 bg-white h-full border-r border-gray-200 transform -translate-x-full lg:translate-x-0 transition-all duration-300 ease-in-out flex flex-col overflow-hidden antialiased"
>
  <!-- Header Logo -->
  <div class="flex items-center justify-center h-14 border-b border-gray-200">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 bg-indigo-500 rounded-md flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <span
        *ngIf="!(collapsed$ | async)"
        class="text-lg font-semibold text-gray-900"
      >
        Hexalib
      </span>
    </div>
  </div>

  <!-- Profil Utilisateur -->
  <div class="px-5 py-4 border-b border-gray-200">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-indigo-500 rounded-full flex items-center justify-center text-white font-medium text-sm">
        {{ (currentUser?.nomComplet || 'U')?.charAt(0) }}
      </div>
      <div *ngIf="!(collapsed$ | async)" class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-900 truncate">
          {{ currentUser?.nomComplet || 'Utilisateur' }}
        </p>
        <p class="text-xs text-gray-500">
          {{ currentUser?.role === 'ADMIN' ? 'Administrateur' : 'Vendeur' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Menu -->
  <div class="overflow-y-auto flex-grow">
    <ul class="flex flex-col py-4 space-y-1">
      <!-- Titre "Menu" -->
      <li class="px-5" *ngIf="!(collapsed$ | async)">
        <div class="flex flex-row items-center h-8">
          <div class="text-sm font-light tracking-wide text-gray-500 uppercase">Menu</div>
        </div>
      </li>

      <!-- Items -->
      <li *ngFor="let item of menuItems">
        <a
          [routerLink]="item.route || null"
          routerLinkActive="bg-gray-50 text-gray-800 border-l-4 border-indigo-500"
          [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
          (click)="handleMenuClick(item)"
          [class.opacity-50]="item.disabled"
          [class.pointer-events-none]="item.disabled"
          class="relative flex flex-row items-center h-11 focus:outline-none hover:bg-gray-50 text-gray-600 hover:text-gray-800 border-l-4 border-transparent hover:border-indigo-500 pr-6 transition-colors duration-200"
        >
          <span class="inline-flex justify-center items-center ml-4">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"/>
            </svg>
          </span>
          <span
            *ngIf="!(collapsed$ | async)"
            class="ml-2 text-sm tracking-wide truncate"
          >
            {{ item.label }}
          </span>
          <span
            *ngIf="item.badge && !(collapsed$ | async)"
            class="px-2 py-0.5 ml-auto text-xs font-medium tracking-wide text-indigo-500 bg-indigo-50 rounded-full"
          >
            {{ item.badge }}
          </span>
        </a>
      </li>

      <!-- Déconnexion -->
      <li class="px-5 mt-auto" *ngIf="!(collapsed$ | async)">
        <div class="flex flex-row items-center h-8">
          <div class="text-sm font-light tracking-wide text-gray-500 uppercase">Compte</div>
        </div>
      </li>
      <li>
        <button
          (click)="logout()"
          class="relative flex flex-row items-center h-11 focus:outline-none hover:bg-gray-50 text-gray-600 hover:text-gray-800 border-l-4 border-transparent hover:border-indigo-500 pr-6 transition-colors duration-200"
        >
          <span class="inline-flex justify-center items-center ml-4">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </span>
          <span
            *ngIf="!(collapsed$ | async)"
            class="ml-2 text-sm tracking-wide truncate"
          >
            Déconnexion
          </span>
        </button>
      </li>
    </ul>
  </div>
</aside>
